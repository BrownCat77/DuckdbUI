[project]
name = "duckdbui"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.1",
    "taskipy>=1.14.1",
    "tkinterdnd2>=0.4.3",
]

[project.scripts]
duckdbui = "duckdbui.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]

[tool.taskipy.tasks]
run = "uv run duckdbui"
build = "uv run pyinstaller --onefile --windowed --name duckdbui --add-data \"documents;documents\" --hidden-import uuid src/duckdbui/main.py"

[tool.hatch.build.targets.wheel]
packages = ["src/duckdbui"]
